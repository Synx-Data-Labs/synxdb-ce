name: build
on:
  push: { branches: [main], tags: ['v*'] }
  # Docs-only PRs skip the full arm64 build/smoke/cluster matrix. Scoped to
  # pull_request only (NOT push) so a release tag build is never path-filtered.
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', 'NOTICE', '.gitignore']
  workflow_dispatch:
# Least privilege by default; jobs that need more declare it explicitly.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm   # GitHub-hosted arm64 (free for public repos)
    permissions:
      contents: read
      packages: write   # push the toolchain build cache to GHCR (push events only)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry-backed BuildKit cache: keyed on toolchain/Dockerfile's content + its
      # GCC_VERSION build-arg (BuildKit hashes both per-layer), so an unchanged pin pulls
      # cached layers instead of recompiling GCC from source, while a real Dockerfile/
      # GCC_VERSION change invalidates from that layer on. See T20260804-650996.
      - name: Build toolchain image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: toolchain/
          platforms: linux/arm64
          tags: coc-toolchain:gcc12
          load: true
          cache-from: type=registry,ref=ghcr.io/synx-data-labs/2026-cfp-coc-asia/coc-toolchain:buildcache
          # Cache is written only on push to main/tags (never pull_request/dispatch),
          # so a PR can't poison the cache that release tag builds read.
          cache-to: ${{ github.event_name == 'push' && 'type=registry,ref=ghcr.io/synx-data-labs/2026-cfp-coc-asia/coc-toolchain:buildcache,mode=max' || '' }}
      - name: Build env image
        run: docker build --platform=linux/arm64 -t coc-build:rocky8 .
      - name: Build + package
        run: |
          docker run --rm --platform=linux/arm64 -e MAKE_JOBS=2 -v "$PWD":/work coc-build:rocky8 \
            bash -lc 'bash /opt/build.sh && bash /opt/vendor.sh && PKG_VERSION=${PKG_VERSION:-2.1.0} bash /work/package.sh'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: packages, path: dist/* }

  # Portability proof: one build loads + runs on every glibc >= 2.28 arm64 distro.
  smoke:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false   # one flaky lane shouldn't mask the rest
      matrix:
        image:
          - 'rockylinux:8'        # glibc 2.28 — the build floor
          - 'rockylinux:9'        # 2.34
          - 'ubuntu:20.04'        # 2.31
          - 'ubuntu:22.04'        # 2.35
          - 'ubuntu:24.04'        # 2.39
          - 'debian:12'           # 2.36
          - 'opensuse/leap:15.5'  # 2.31 (SUSE / zypper)
          - 'amazonlinux:2023'    # 2.34
          - 'fedora:40'           # 2.39
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: packages, path: dist }
      - name: Install + portability gate on ${{ matrix.image }}
        run: |
          docker run --rm --platform=linux/arm64 -v "$PWD":/work ${{ matrix.image }} bash -lc '
            (command -v apt-get >/dev/null && apt-get update -qq && apt-get install -y /work/dist/synxdb-ce_*_arm64.deb) ||
            (command -v zypper >/dev/null && zypper --no-gpg-checks --non-interactive install -y /work/dist/synxdb-ce-*.aarch64.rpm) ||
            (command -v dnf >/dev/null && dnf -y install /work/dist/synxdb-ce-*.aarch64.rpm);
            bash /work/test.sh'

  # Functional proof: a real MPP cluster (coordinator + standby + 2 primaries + 2 mirrors).
  # cluster.sh self-verifies and exits non-zero if any segment is down (prints CLUSTER OK).
  cluster:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: packages, path: dist }
      - name: Bring up the MPP demo cluster + assert topology (rockylinux:9)
        run: |
          docker run --rm --platform=linux/arm64 -v "$PWD":/work rockylinux:9 \
            bash -lc 'bash /work/cluster.sh'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, cluster]
    runs-on: ubuntu-24.04-arm
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: packages, path: dist }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with: { files: dist/* }
